name: intraday-brief

on:
  schedule:
    # Taiwan (UTC+8), Mon–Fri. Two separate intraday pushes (short jobs).
    - cron: '5 1 * * 1-5'    # 09:05
    - cron: '45 2 * * 1-5'   # 10:45
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsx src/run.ts intraday
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Taipei